<style>

button{font:inherit;color:inherit;cursor:pointer;border:0}
.hud{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#0e1022cc;backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}

@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.frog.hop{animation:hop .45s ease-out}@keyframes hop{0%{transform:translate(-50%,0)}50%{transform:translate(-50%,-34px) scale(1.15)}100%{transform:translate(-50%,0)}}
.frog.splash{animation:splash .8s ease-in}@keyframes splash{40%{transform:translate(-50%,-26px)}100%{transform:translate(-50%,40px) scale(.4);opacity:0}}
.drop{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:34px;animation:popin .4s}

.ex.ok{border-color:var(--good)}.ex.no{border-color:var(--bad)}
.qtimer{height:8px;border-radius:999px;background:#ffffff18;overflow:hidden;max-width:900px;margin:0 auto}.qtimer i{display:block;height:100%;background:var(--main)}

<script>
const GRADE=4,GAME='quiz-ox',KEY='quiz-ox-v1',TITLE='OX 징검다리',EMOJI='🐸';
const DATA=[["삼각형 세 각의 합은 180°예요.",true,"어떤 삼각형이든 세 각의 합은 180°예요."],["직각은 180°예요.",false,"직각은 90°예요. 180°는 평각이에요."],["정사각형은 직사각형이라고 할 수 있어요.",true,"네 각이 모두 직각이라 직사각형이기도 해요."],["1조는 1억이 1000개예요.",false,"1조는 1억이 10000개예요."],["0.3 + 0.08 = 0.11이에요.",false,"0.3 + 0.08 = 0.38이에요."],["화석은 주로 퇴적암에서 발견돼요.",true,"생물이 퇴적물에 묻혀 굳으며 화석이 돼요."],["현무암은 표면에 구멍이 많아요.",true,"용암 속 가스가 빠져나가 구멍이 생겼어요."],["물이 증발하면 얼음이 돼요.",false,"증발하면 수증기(기체)가 돼요."],["차가운 컵 겉의 물방울은 컵 속 물이 새어 나온 거예요.",false,"공기 중 수증기가 차가워져 물방울이 된 응결이에요."],["평행사변형은 마주 보는 두 변의 길이가 같아요.",true,"평행사변형은 마주 보는 변의 길이가 같아요."],["빛은 곧게 나아가요.",true,"빛의 직진 때문에 그림자가 생겨요."],["식물은 잎에서 양분을 만들어요.",true,"잎에서 햇빛을 받아 광합성을 해요."],["3/5 + 4/5 = 7/10이에요.",false,"분모가 같으면 분자끼리 더해요. 7/5(=1과 2/5)예요."],["꺾은선그래프는 시간에 따른 변화를 나타내기 좋아요.",true,"기온 변화 등을 나타내기 좋아요."],["지진이 나면 승강기를 타고 빨리 내려가요.",false,"지진 때는 계단을 이용하고 넓은 곳으로 대피해요."],["둔각은 90°보다 크고 180°보다 작은 각이에요.",true,"예: 120°, 150°"],["공공 기관은 주민 모두의 이익을 위해 일해요.",true,"시청, 소방서, 경찰서 등이 공공 기관이에요."],["물이 얼면 부피가 줄어들어요.",false,"물이 얼면 부피가 늘어나요. 그래서 얼린 병이 터지기도 해요."],["마라톤은 육상 종목이에요.",true,"마라톤은 42.195km를 달리는 육상 경기예요."],["사다리꼴은 평행한 변이 한 쌍도 없어요.",false,"사다리꼴은 평행한 변이 적어도 한 쌍 있어요."]];

<script>
'use strict';
const $=s=>document.querySelector(s);
const LVN={easy:'🟢 쉬움',normal:'🟡 보통',hard:'🔴 어려움'};
const QS=new URLSearchParams(location.search);
let LV=QS.get('lv');if(!LVN[LV]){try{LV=localStorage.getItem('class-level')}catch(e){}}if(!LVN[LV])LV='normal';
const FAST=QS.get('fast')==='1';
const SKEY=LV==='normal'?KEY:KEY+'-'+LV;
const SAVE_V=1;
const L=(e,n,h)=>LV==='easy'?e:LV==='hard'?h:n;
/* 저학년일수록 느긋하게 */
const GS={1:1.35,2:1.2,3:1.1,4:1,5:.95,6:.9}[GRADE]||1;
const T=ms=>FAST?Math.min(ms,60):ms;
$('#lvPill').textContent=LVN[LV];
window.addEventListener('error',e=>{console.error(e.message);$('#err').style.display='flex'});
$('#errReset').onclick=()=>{try{localStorage.removeItem(SKEY)}catch(e){}location.href=location.pathname+'?lv='+LV};
function fresh(){return{v:SAVE_V,end:0,wins:0,best:0,plays:0}}
function loadSave(){try{if(QS.get('reset')==='1')localStorage.removeItem(SKEY);const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.v===SAVE_V)return Object.assign(fresh(),s)}catch(e){}return fresh()}
const S=loadSave();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function markDone(){try{const id=GAME+'@'+LV;if(localStorage.getItem('class-done-skip-'+id)===String(S.end))return;const d=JSON.parse(localStorage.getItem('class-done')||'{}')||{};if(!d[id]){d[id]={how:'auto',at:new Date().toISOString()};localStorage.setItem('class-done',JSON.stringify(d))}}catch(e){}}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
/* 소리 */
let MUTE=false;try{MUTE=localStorage.getItem('arc-mute')==='1'}catch(e){}
$('#mute').textContent=MUTE?'🔇':'🔊';$('#mute').onclick=()=>{MUTE=!MUTE;$('#mute').textContent=MUTE?'🔇':'🔊';try{localStorage.setItem('arc-mute',MUTE?'1':'0')}catch(e){}};
let AC=null;function tone(f,d,type,vol,delay){if(MUTE||FAST)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
const SND={good:()=>{tone(660,.12,'triangle');tone(990,.18,'triangle',.15,.08)},bad:()=>tone(160,.3,'sawtooth',.12),pop:()=>tone(880,.08,'square',.08),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,.3,'sine',.15,i*.18)),tick:()=>tone(1200,.04,'square',.05)};
/* 문제 읽어 주기 (1·2학년은 기본으로 켜짐) */
let TTS=GRADE<=2;try{const v=localStorage.getItem('quiz-tts');if(v!=null)TTS=v==='1'}catch(e){}
const HAS_TTS='speechSynthesis' in window;
function ttsBtn(){$('#tts').classList.toggle('off',!TTS);$('#tts').title=TTS?'문제 읽어 주기 켜짐':'문제 읽어 주기 꺼짐'}
if(!HAS_TTS)$('#tts').style.display='none';
$('#tts').onclick=()=>{TTS=!TTS;try{localStorage.setItem('quiz-tts',TTS?'1':'0')}catch(e){}ttsBtn();if(!TTS)try{speechSynthesis.cancel()}catch(e){}};ttsBtn();
function speak(t,force){if(!HAS_TTS||FAST||(!TTS&&!force))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[^\p{L}\p{N}\s.,?!%°×÷+\-=:/()·]/gu,' ').replace(/×/g,' 곱하기 ').replace(/÷/g,' 나누기 '));u.lang='ko-KR';u.rate=GRADE<=2?.9:1;speechSynthesis.speak(u)}catch(e){}}
/* 효과 */
function floatTxt(x,y,txt,color){const e=h('div','fx float',txt);e.style.left=x+'px';e.style.top=y+'px';if(color)e.style.color=color;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
function confetti(){if(FAST)return;const cs=['#ffd166','#ff8a5c','#5eea9a','#7fc8ff','#c792ea','#ff5a6e'];for(let i=0;i<70;i++){const c=h('div','conf');c.style.left=Math.random()*100+'vw';c.style.background=cs[i%cs.length];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
function heartsTxt(n,max){return '❤️'.repeat(Math.max(0,n))+'🤍'.repeat(Math.max(0,max-n))}
function hud(html){$('#hudX').innerHTML=html}
/* 시작 화면 */
function intro(desc,rules,onStart,extra){hud('');const a=$('#app');a.innerHTML='';const box=h('div','intro panel popin',`<div class="big">${EMOJI}</div><h1>${TITLE}</h1><p>${desc}</p><div class="rules">${rules.map(r=>'• '+r).join('<br>')}</div>${S.wins?`<p class="muted">🏆 지금까지 ${S.wins}번 성공 · 최고 ${S.best}점</p>`:''}<div class="row" id="startRow"></div>`);a.appendChild(box);
  const row=box.querySelector('#startRow');(extra||[[ '▶ 시작하기',onStart]]).forEach(([t,f],i)=>{const b=h('button','btn'+(i?' ghost':''),t);b.onclick=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}f()};row.appendChild(b)});if(FAST)setTimeout(()=>row.querySelector('button').click(),10)}
/* 결과 화면 */
function finish(win,score,stars,msg){if(win){S.end=Date.now();S.wins++;markDone();confetti();SND.win()}else SND.lose();S.plays++;if(score>S.best)S.best=score;save();try{speechSynthesis.cancel()}catch(e){}
  const md=h('div','modal',`<div class="panel popin"><div style="font-size:70px">${win?'🏆':'💦'}</div><h2 style="font-size:32px;margin:6px 0;color:${win?'var(--good)':'var(--bad)'}">${win?'성공!':'아쉬워요!'}</h2>${win?`<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:''}<p style="font-size:20px">${msg||''}<br>점수 <b>${score}</b>점 · 최고 ${S.best}점</p>${win?'<p class="muted">완료 기록이 저장되었어요! 🎉</p>':''}<div class="row"><button class="btn" id="again">🔁 다시 하기</button><a class="btn ghost" href="index.html" style="text-decoration:none">🏠 게임 교실</a></div></div>`);
  document.body.appendChild(md);md.querySelector('#again').onclick=()=>{md.remove();start()}}
</script>
<script>

const STEPS=L(8,10,12),MAXH=L(5,4,3),QT=LV==='easy'?0:Math.round(L(0,22,14)*GS);
let G=null;
function stop(){if(!G)return;G.over=true;clearInterval(G.tm);clearTimeout(G.nx)}
function start(){stop();intro('개구리가 강을 건너요! 문장이 맞으면 <b>⭕ 돌</b>, 틀리면 <b>❌ 돌</b>로 폴짝 뛰어요.',[`징검다리 ${STEPS}칸을 건너면 성공`,`틀리면 물에 풍덩! 하트가 하나 줄어요 (하트 ${MAXH}개)`,QT?`한 문제당 ${QT}초 안에 골라요`:'시간 제한 없이 천천히 생각해요','답을 고르면 해설이 나와요 · 키보드 O / X 도 돼요'],play)}
function play(){G={qs:shuffle(DATA),qi:0,pos:0,hearts:MAXH,score:0,busy:false,over:false};const a=$('#app');a.innerHTML='';
  let cells='<div class="cell"><div class="bank">🏁</div></div>';for(let i=1;i<=STEPS;i++)cells+=`<div class="cell"><div class="stone"></div></div>`;cells+='<div class="cell"><div class="bank">🏆</div></div>';
  a.appendChild(h('div','river',`<div class="path" id="path">${cells}</div>`));
  a.appendChild(h('div','qbox','<span id="q"></span>'));if(QT)a.appendChild(h('div','qtimer','<i id="qti"></i>'));
  const ch=h('div','choices','<button class="choice" id="cO">⭕<small>맞아요</small></button><button class="choice" id="cX">❌<small>틀려요</small></button>');a.appendChild(ch);
  $('#cO').onclick=()=>pick(true);$('#cX').onclick=()=>pick(false);a.appendChild(h('div','','<div id="ex"></div>'));
  G.frog=h('div','frog','🐸');placeFrog();ask()}
function placeFrog(){const cells=$('#path').children;[...cells].forEach((c,i)=>{const s=c.querySelector('.stone');if(s)s.classList.toggle('past',i<=G.pos&&i>0)});cells[G.pos].appendChild(G.frog)}
function upHud(){hud(`<span class="chip">🪨 ${G.pos}/${STEPS}</span> <span class="chip hearts">${heartsTxt(G.hearts,MAXH)}</span> <span class="chip">⭐ ${G.score}</span>`)}
function ask(){if(G.over)return;if(G.qi>=G.qs.length){G.qs=shuffle(DATA);G.qi=0}G.q=G.qs[G.qi++];G.busy=false;$('#q').textContent=G.q[0];$('#ex').innerHTML='';$('#cO').disabled=$('#cX').disabled=false;upHud();speak(G.q[0]);
  if(QT){G.left=QT;const bar=$('#qti');bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;bar.style.transition=`width ${QT}s linear`;bar.style.width='0%';clearInterval(G.tm);
    G.tm=setInterval(()=>{if(G.over||G.busy)return;G.left--;if(G.left<=3&&G.left>0)SND.tick();if(G.left<=0)pick(null)},T(1000))}}
function pick(v){if(G.busy||G.over)return;G.busy=true;clearInterval(G.tm);$('#cO').disabled=$('#cX').disabled=true;const right=v===G.q[1];const ex=$('#ex');
  if(right){G.pos++;G.score+=10+(QT?Math.max(0,G.left):0);SND.good();G.frog.classList.remove('hop','splash');void G.frog.offsetWidth;placeFrog();G.frog.classList.add('hop')}
  else{G.hearts--;SND.bad();G.frog.classList.remove('hop','splash');void G.frog.offsetWidth;G.frog.classList.add('splash');const cell=$('#path').children[Math.min(G.pos+1,STEPS)];const d=h('div','drop','💦');cell.appendChild(d);
    setTimeout(()=>{d.remove();G.frog.classList.remove('splash');placeFrog()},T(900))}
  const ans=G.q[1]?'⭕ 맞아요':'❌ 틀려요';
  ex.innerHTML=`<div class="ex ${right?'ok':'no'} popin"><b style="color:${right?'var(--good)':'var(--bad)'}">${right?'정답! 폴짝!':v===null?'⏰ 시간 초과! 풍덩!':'아쉬워요! 풍덩!'}</b> 정답은 <b>${ans}</b><br>${esc(G.q[2])}<br><button class="btn" id="nx" style="margin-top:10px">다음 ▶</button></div>`;upHud();
  const done=G.pos>=STEPS,dead=G.hearts<=0;
  const go=()=>{clearTimeout(G.nx);if(G.over)return;if(done){stop();G.frog.classList.add('hop');$('#path').lastElementChild.appendChild(G.frog);const st=G.hearts===MAXH?3:G.hearts>=Math.ceil(MAXH/2)?2:1;finish(true,G.score,st,`징검다리 ${STEPS}칸을 모두 건넜어요!`)}else if(dead){stop();finish(false,G.score,0,'하트를 모두 잃었어요. 다시 도전해 봐요!')}else ask()};
  $('#nx').onclick=go;if(FAST)G.nx=setTimeout(go,30)}
document.addEventListener('keydown',e=>{if(!G||G.over||G.busy)return;const k=e.key.toLowerCase();if(k==='o'||k==='arrowleft')pick(true);if(k==='x'||k==='arrowright')pick(false)});
start();

</script>
