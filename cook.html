<!DOCTYPE html>
<html lang="ko">
<head>
<script>(function(){var P='g4-',S=Storage.prototype,G=S.getItem,T=S.setItem,R=S.removeItem;S.getItem=function(k){return G.call(this,P+k)};S.setItem=function(k,v){return T.call(this,P+k,v)};S.removeItem=function(k){return R.call(this,P+k)}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꼬마 요리사 대회 · 4학년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--main:#e0567a;--ink:#3a3150;--soft:#fff8ef}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--soft),#fff 40%,color-mix(in srgb,var(--main) 18%,#fff));min-height:100vh;font-size:19px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.btn,.opt,.tok,.cell,.coin,.mc,.pad button,.top,.cnt,.bh{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:#ffffffd9;backdrop-filter:blur(6px);border-bottom:3px solid color-mix(in srgb,var(--main) 40%,#fff)}
.top a{color:var(--ink);text-decoration:none;background:#fff;border:2px solid #e8e1f0;border-radius:999px;padding:5px 12px;font-size:16px}
.top .t{flex:1;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pill{background:var(--main);color:#fff;border-radius:999px;padding:4px 12px;font-size:15px;white-space:nowrap}
.top .ib{background:#fff;border:2px solid #e8e1f0;border-radius:50%;width:40px;height:40px;font-size:20px;padding:0}
#app{max-width:880px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border-radius:28px;padding:26px 20px;box-shadow:0 8px 0 color-mix(in srgb,var(--main) 35%,#fff),0 14px 30px #0000000f;text-align:center}
.big{font-size:84px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-size:36px;margin:8px 0;color:var(--main);text-shadow:0 2px 0 #0000000d}
h2{font-size:26px;margin:6px 0}
.lvp{display:inline-block;background:color-mix(in srgb,var(--main) 15%,#fff);border-radius:999px;padding:4px 14px;margin:4px 0 8px}
.story{font-size:20px;line-height:1.7;max-width:620px;margin:10px auto}
.map{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0}
.mp{width:96px;padding:10px 4px;border-radius:18px;background:#f6f3fa;font-size:34px;line-height:1.2}
.mp small{display:block;font-size:14px;margin-top:4px}
.mp.done{background:#e3f8e7;outline:3px solid #7bd389}
.lvinfo{color:#7a6f8c}
.btn{display:inline-block;border:none;border-radius:20px;padding:14px 28px;font-size:23px;background:#efeaf6;margin:6px;text-decoration:none;color:var(--ink);box-shadow:0 5px 0 #d6cfe2}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d6cfe2}
.btn.go{background:var(--main);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--main) 70%,#000)}
.btn.ghost{background:#fff;border:2px solid #e8e1f0;box-shadow:none;font-size:18px}
.stagehead{text-align:center;margin-bottom:8px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:4px}
.dots span{font-size:22px;width:40px;height:40px;line-height:40px;border-radius:50%;background:#efeaf6;opacity:.55}
.dots span.d{background:#d9f5de;opacity:1}
.dots span.c{background:var(--main);opacity:1;transform:scale(1.15)}
.prompt{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:12px 16px;font-size:21px;line-height:1.5;box-shadow:0 4px 0 #ece6f3;margin:8px 0}
.prompt span{flex:1}
.spk{flex:none;border:none;background:color-mix(in srgb,var(--main) 18%,#fff);border-radius:50%;width:46px;height:46px;font-size:22px}
.tip{background:#fff7d6;border:2px dashed #f3cf55;border-radius:16px;padding:10px 14px;margin:8px 0;font-size:18px}
.body{margin-top:10px}
.body>.btn,.body>.peek{display:table;margin:12px auto}
.cnt{text-align:center;font-size:18px;color:#8a7f9b;margin:4px 0}
.q{text-align:center;font-size:24px;line-height:1.6;margin:8px 0 12px}
.pic{text-align:center;font-size:46px;line-height:1.35;margin:6px 0 10px;letter-spacing:4px}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 16px}
.seq span{min-width:62px;height:62px;line-height:62px;padding:0 6px;border-radius:16px;background:#fff;font-size:32px;box-shadow:0 4px 0 #ece6f3;font-family:'Jua'}
.seq .blank{background:#fff3c4;border:3px dashed #f0b429;color:#c08a00}
.seq .blank.filled{background:#dff7e3;border:3px solid #6bcb77;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.opt{min-width:96px;min-height:72px;padding:10px 18px;border:none;border-radius:20px;background:#fff;font-size:30px;box-shadow:0 6px 0 #e3dcec;transition:transform .1s}
.opt.long{font-size:22px}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#c9f2cf;box-shadow:0 6px 0 #7bd389}
.opt:disabled{opacity:.35}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hint{animation:hint 1s ease-in-out 2;outline:4px solid #ffc83d!important;outline-offset:3px}
@keyframes hint{50%{transform:scale(1.1)}}
/* drag & drop */
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:80px;padding:12px;border-radius:22px;background:#ffffffb3;border:3px dashed #e3dcec}
.tok{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border-radius:18px;padding:8px 14px;font-size:34px;line-height:1.15;box-shadow:0 5px 0 #e0d8ea;cursor:grab;text-align:center;min-width:72px}
.tok small{display:block;font-family:'Gowun Dodum';font-size:15px}
.tok.txt{font-size:24px;padding:14px 16px}
.tok.sel{outline:4px solid var(--main);transform:translateY(-4px) scale(1.06)}
.tok.lift{opacity:.3}
.tok.used{cursor:default;box-shadow:none;background:#f3fff4;font-size:26px;padding:4px 8px;min-width:0}
.tok.used.txt{font-size:18px}
.dragghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12) rotate(-4deg);box-shadow:0 12px 24px #0003}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.bin{border-radius:22px;background:#fff;border:3px solid color-mix(in srgb,var(--main) 35%,#fff);min-height:130px;padding:8px;transition:background .2s}
.bin .bh{font-size:22px;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--main) 14%,#fff);text-align:center}
.bin .bh small{font-family:'Gowun Dodum';font-size:16px}
.bin .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding-top:8px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}
.slot{min-height:90px;min-width:96px;display:flex;align-items:center;justify-content:center;border-style:dashed}
.slot b{font-size:28px;color:#c8bed6}
.slot.fill{border-style:solid;background:#f3fff4}
.arrowlbl{text-align:center;font-size:18px;color:#8a7f9b;margin:12px 0 2px}
/* memory */
.mem{display:grid;gap:10px;max-width:640px;margin:0 auto}
.mc{position:relative;aspect-ratio:1/1;border:none;border-radius:18px;background:transparent;perspective:600px;padding:0}
.mc span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:18px;backface-visibility:hidden;transition:transform .35s;font-size:clamp(18px,4.6vw,30px);line-height:1.1;padding:4px;word-break:keep-all}
.mc .f{background:#fff;box-shadow:0 5px 0 #e0d8ea;transform:rotateY(180deg)}
.mc .b{background:var(--main);color:#fff;font-size:30px;box-shadow:0 5px 0 color-mix(in srgb,var(--main) 70%,#000)}
.mc.up .f{transform:rotateY(0)}.mc.up .b{transform:rotateY(180deg)}
.mc.ok .f{background:#c9f2cf;box-shadow:0 5px 0 #7bd389}
.peek{display:block;margin:12px auto 0}
/* clock */
.clkw{display:flex;justify-content:center;margin:6px 0}
.clk{width:min(70vw,250px);height:auto;touch-action:none;user-select:none}
.clk .face{fill:#fff;stroke:var(--main);stroke-width:6}
.clk .tk{stroke:#c8bed6;stroke-width:1.5}.clk .tk5{stroke:#7a6f8c;stroke-width:3}
.clk .num{font:20px Jua,sans-serif;text-anchor:middle;fill:var(--ink)}
.clk .hh{stroke:#ff6b6b;stroke-width:8;stroke-linecap:round}
.clk .mh{stroke:#4d96ff;stroke-width:5;stroke-linecap:round}
.clk .pin{fill:var(--ink)}
.clk.set{cursor:grab}
.cbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.cbtns button{border:none;border-radius:14px;padding:10px 14px;font-size:18px;background:#fff;box-shadow:0 4px 0 #e0d8ea;font-family:'Jua'}
.cbtns .hb{color:#e04848}.cbtns .mb{color:#2f6fd6}
.dig{text-align:center;font-family:'Jua';font-size:26px;color:#7a6f8c;min-height:34px}
.legend{text-align:center;font-size:16px;color:#7a6f8c}
.legend b.h{color:#e04848}.legend b.m{color:#2f6fd6}
/* coins */
.shop{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0}
.shop .pic{margin:0}
.price{display:inline-block;background:#fff3c4;border-radius:12px;padding:2px 12px;font-family:'Jua';font-size:28px}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:12px 0}
.coin{border:none;border-radius:50%;width:74px;height:74px;font-size:22px;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;box-shadow:inset 0 -5px 0 #0002,0 4px 0 #0001}
.coin small{font-size:12px}
.c10{background:#e8a467;color:#5a3415}.c50{background:#d9dde3;color:#3d4450;width:80px;height:80px}.c100{background:#cfd5dd;color:#2f3640;width:84px;height:84px}.c500{background:#e3e7ec;color:#2b313a;width:92px;height:92px;font-size:24px}
.bill{display:inline-block;background:#c9e7c4;border:2px solid #8fbf87;border-radius:8px;padding:4px 12px;font-family:'Jua'}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:110px;border-style:dashed;margin-top:8px}
.tray .coin{width:58px;height:58px;font-size:17px}
.tray .empty{color:#b9afc8}
.sum{text-align:center;font-family:'Jua';font-size:24px;min-height:32px;margin:6px 0}
.msg{text-align:center;min-height:30px;font-size:19px;color:#c0392b}
/* balloon */
.bbar{display:flex;justify-content:center;gap:18px;font-family:'Jua';font-size:24px}
.barea{position:relative;height:min(62vh,440px);overflow:hidden;border-radius:24px;background:linear-gradient(#bfe6ff,#e9f7ff 70%,#d4f1c5);margin-top:8px;touch-action:manipulation}
.bal{position:absolute;bottom:-100px;width:86px;height:100px;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Jua';font-size:26px;text-shadow:0 2px 0 #0003;cursor:pointer;box-shadow:inset -10px -12px 0 #0000001a;user-select:none;padding:4px;text-align:center;line-height:1.05;word-break:keep-all}
.bal.w{font-size:20px}
.bal::after{content:'';position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#0004}
.bal.pop{animation:pop .3s forwards}@keyframes pop{to{transform:scale(1.6);opacity:0}}
.bal.boo{animation:shake .4s;filter:grayscale(1)}
.bal.hint{outline:5px solid #ffc83d}
.fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffffcc;font-family:'Jua';font-size:28px;gap:10px;z-index:3}
/* path */
.grid{display:grid;gap:8px;max-width:520px;margin:6px auto}
.cell{aspect-ratio:1/1;border:none;border-radius:16px;background:#fff;font-size:clamp(18px,5vw,28px);box-shadow:0 5px 0 #e0d8ea;position:relative;padding:0}
.cell.nb{background:#fffbe3;outline:3px dashed #f0c64d}
.cell.on{background:#6bcb77;color:#fff;box-shadow:0 5px 0 #3f9b4b}
.cell.start::before{content:'🚩';position:absolute;top:-12px;left:-6px;font-size:22px}
.cell.goal::before{content:'🏁';position:absolute;top:-12px;right:-6px;font-size:22px}
/* find */
.farea{position:relative;height:min(58vh,420px);border-radius:24px;background:radial-gradient(circle at 30% 20%,#fff,#ffeedd);overflow:hidden;box-shadow:inset 0 0 0 3px #f2dcc4}
.fi{position:absolute;border:none;background:none;padding:0;line-height:1;transform:translate(-50%,-50%)}
.fi.found{animation:pop2 .4s forwards}@keyframes pop2{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
/* room */
.inv{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-family:'Jua';font-size:20px;margin-bottom:8px}
.key{background:#fff;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 #e0d8ea;border:3px solid var(--c,#ddd);font-size:22px}
.key.empty{opacity:.55;border-style:dashed}
.scene{position:relative;height:min(56vh,400px);border-radius:26px;overflow:hidden;box-shadow:inset 0 -60px 0 #0000000d,0 8px 0 #0000000d}
.obj{position:absolute;border:none;background:none;padding:0;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 0 #0002);transition:transform .15s}
.obj:hover{transform:translate(-50%,-50%) scale(1.12)}
.obj.has::after{content:'❔';position:absolute;top:-8px;right:-14px;font-size:20px;animation:bob 1.6s infinite}
.obj.solved::after{content:'✅';animation:none}
.bubble{margin-top:10px;background:#fff;border-radius:20px;padding:12px 16px;font-size:20px;line-height:1.5;text-align:center;box-shadow:0 4px 0 #ece6f3;min-height:54px}
.lockbox{text-align:center}
.lq{font-size:20px;margin:6px 0 10px;line-height:1.5}
.slots2{display:flex;justify-content:center;gap:10px;margin:8px 0}
.slots2 div{width:64px;height:76px;border-radius:16px;background:#f6f3fa;border:3px solid #e0d8ea;font-family:'Jua';font-size:36px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slots2 div small{font-size:18px;line-height:1}
.pad{display:grid;grid-template-columns:repeat(5,64px);gap:8px;justify-content:center;margin-top:10px}
.pad button{height:60px;border:none;border-radius:16px;background:#fff;box-shadow:0 4px 0 #e0d8ea;font-size:28px}
.inrow{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0}
.inbox{font:28px Jua,sans-serif;width:min(60vw,260px);text-align:center;padding:10px 12px;border-radius:16px;border:3px solid color-mix(in srgb,var(--main) 45%,#fff);outline:none}
.inbox:focus{border-color:var(--main)}.inbox.ok{background:#dff7e3;border-color:#6bcb77}
.unit{font-family:Jua;font-size:24px}
.note{border:2px solid #8fbf87;border-radius:10px;background:#c9e7c4;color:#24481f;padding:10px 14px;font-family:Jua;font-size:20px;box-shadow:0 4px 0 #0001}
.note small{font-size:12px}.n5000{background:#f3d9b1;border-color:#d1a86a;color:#5a3b10}
.tray .note{font-size:15px;padding:6px 8px}
table.mapg{margin:4px auto;border-collapse:collapse;letter-spacing:0}table.mapg td{width:46px;height:46px;border:1px dashed #c9bfd8;font-size:28px;text-align:center;background:#fffdf5}
table.mapg th{font-size:15px;color:#8a7f9b;padding:2px 4px}
body.g3 .story,body.g4 .story{font-size:19px}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:#2b23407a;display:flex;align-items:center;justify-content:center;padding:12px}
.ov.hide{display:none}
.ovbox{position:relative;background:var(--soft);border-radius:28px;padding:22px 16px 18px;width:min(760px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 50px #0004;text-align:center}
.ovx{position:absolute;top:10px;right:10px;border:none;background:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}
.ovbox h3{font-size:26px;margin:4px 40px 6px}
.conf{position:fixed;top:-40px;z-index:60;font-size:28px;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
body.g1{font-size:21px}
body.g1 .prompt{font-size:23px}
@media (max-width:520px){h1{font-size:30px}.opt{min-width:80px;font-size:26px}.pad{grid-template-columns:repeat(5,52px)}.pad button{height:54px}}
</style>
</head>

<script>
'use strict';
const $=s=>document.querySelector(s);
const LVN={easy:'🟢 쉬움',normal:'🟡 보통',hard:'🔴 어려움'};
let LV=new URLSearchParams(location.search).get('lv');
if(!LVN[LV]){try{LV=localStorage.getItem('class-level')}catch(e){}}
if(!LVN[LV])LV='normal';
const D=DATA[LV];
const SKEY=LV==='normal'?KEY:KEY+'-'+LV;
const HINT_AT={easy:1,normal:3,hard:1e9}[LV];
const COL={'🔴':'#ff6b6b','🟡':'#f7c948','🔵':'#4d96ff','🟢':'#4cc35d','🟣':'#b26bff'};
function fresh(){return{i:0,stars:[],end:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&typeof s.i==='number'&&s.i<=D.stages.length)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
let S=load();
$('#pill').textContent=GRADE+'학년 · '+LVN[LV];
/* 소리 */
let MUTE=false;try{MUTE=localStorage.getItem('kid-mute')==='1'}catch(e){}
const muteBtn=$('#mute');const setMute=()=>muteBtn.textContent=MUTE?'🔕':'🔔';setMute();
muteBtn.onclick=()=>{MUTE=!MUTE;setMute();try{localStorage.setItem('kid-mute',MUTE?'1':'0')}catch(e){}};
let AC=null;
function beep(f,d,type,vol){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const good=()=>{beep(660,.12);setTimeout(()=>beep(990,.16),100)};
const bad=()=>beep(170,.22,'square',.06);
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22),i*120));
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}☀-➿⬀-⯿️‍]/gu,' ').replace(/×/g,' 곱하기 ').replace(/\+/g,' 더하기 ').replace(/ - /g,' 빼기 '));u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
/* 도구 */
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function shake(e){if(!e)return;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
function glow(e){if(!e)return;e.classList.remove('hint');void e.offsetWidth;e.classList.add('hint');setTimeout(()=>e.classList.remove('hint'),2400)}
function confetti(){const em=['🎉','⭐','🎈','✨','🌟','🍬'];for(let i=0;i<26;i++){const c=h('div','conf',em[i%em.length]);c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}
const strip=s=>String(s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
/* 겹창 */
const ov=$('#ov'),ovin=$('#ovin');
function openOv(node,noClose){ovin.innerHTML='';ovin.appendChild(node);$('#ovx').style.display=noClose?'none':'';ov.classList.remove('hide')}
function closeOv(){ov.classList.add('hide');ovin.innerHTML=''}
$('#ovx').onclick=closeOv;
function popup(html,btn,fn){const b=h('div','',html);const x=h('button','btn go',btn);x.onclick=()=>{closeOv();fn()};b.appendChild(x);openOv(b,true);setTimeout(()=>x.focus(),50)}
/* 끌어 놓기 + 눌러서 옮기기 */
function dnd(root,onDrop,onTap){
  let sel=null;
  root.addEventListener('pointerdown',e=>{
    const t=e.target.closest('.tok');if(!t||t.classList.contains('used')||!root.contains(t))return;
    e.preventDefault();const sx=e.clientX,sy=e.clientY;let gh=null;
    const mv=ev=>{if(!gh&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10){gh=t.cloneNode(true);gh.classList.add('dragghost');gh.classList.remove('sel');gh.style.width=t.offsetWidth+'px';document.body.appendChild(gh);t.classList.add('lift')}
      if(gh){gh.style.left=ev.clientX+'px';gh.style.top=ev.clientY+'px'}};
    const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      if(gh){gh.remove();t.classList.remove('lift');const u=document.elementFromPoint(ev.clientX,ev.clientY);const bin=u&&u.closest('.bin');if(bin&&root.contains(bin)){if(sel){sel.classList.remove('sel');sel=null}onDrop(t,bin)}}
      else if(onTap){onTap(t)}
      else{if(sel===t){t.classList.remove('sel');sel=null}else{if(sel)sel.classList.remove('sel');sel=t;t.classList.add('sel')}}};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });

        if(LV==='easy'&&p.spec.tip)box.appendChild(h('div','tip','💡 '+p.spec.tip));
        const body=h('div','body');box.appendChild(body);openOv(box);CURQ='';
        RUN[p.spec.type](p.spec,body,()=>{solved.add(o.p);b.classList.add('solved');updInv();closeOv();fanfare();msg(`${p.c} 숫자 열쇠 <b style="font-size:28px">${p.d}</b> 를 얻었어요!`+(solved.size===sp.puzzles.length?' 이제 🚪 문으로 가 봐요!':''))},cx);
        return}
      if(o.m)msg(o.m);
    };scene.appendChild(b)});
  function lock(){
    const box=h('div','lockbox');const n=sp.code.length;
    box.innerHTML=`<h3>🔐 비밀번호 ${n}자리</h3><div class="lq">${sp.lockQ}</div><div class="slots2"></div><div class="inv" style="margin-top:8px">${inv.innerHTML}</div><div class="pad"></div><div class="msg"></div>`;
    const sl=box.querySelector('.slots2'),pad=box.querySelector('.pad'),m=box.querySelector('.msg');let ent=[];
    const draw=()=>{sl.innerHTML=sp.code.map((_,i)=>`<div>${sp.showOrder?`<small>${sp.order[i]}</small>`:''}${ent[i]!=null?ent[i]:''}</div>`).join('')};draw();
    [1,2,3,4,5,6,7,8,9,0].forEach(d=>{const b=h('button','',String(d));b.dataset.d=d;b.onclick=()=>{if(ent.length>=n)return;beep(700,.05);ent.push(d);draw();
      if(ent.length===n){if(ent.join('')===sp.code.join('')){good();setTimeout(()=>{closeOv();done()},500)}else{bad();shake(sl);const hn=cx.miss();m.innerHTML='비밀번호가 달라요!'+(hn?`<br>순서: ${sp.order.join(' → ')}`:'');setTimeout(()=>{ent=[];draw()},700)}}};pad.appendChild(b)});
    const bk=h('button','','⌫');bk.onclick=()=>{ent.pop();draw()};pad.appendChild(bk);
    openOv(box);
  }
  updInv();el.append(inv,scene,bub);
};
/* ───── 화면 흐름 ───── */
const app=$('#app');let M=0;
function cxNew(){M=0;return{miss(){M++;return M>=HINT_AT}}}
function intro(){
  app.innerHTML='';const c=h('div','card');
  c.innerHTML=`<div class="big">${INFO.emoji}</div><h1>${INFO.title}</h1><div class="lvp">${GRADE}학년 · ${LVN[LV]}</div><p class="story">${D.story}</p>
  <div class="map">${D.stages.map((s,k)=>`<div class="mp ${k<S.i?'done':''}">${s.icon}<small>${s.title}</small></div>`).join('')}</div>
  <p class="lvinfo">${{easy:'💡 도움말이 있고, 틀리면 바로 힌트를 줘요.',normal:'세 번 틀리면 힌트를 줘요.',hard:'힌트 없이 내 힘으로 도전!'}[LV]}</p>`;
  const sb=h('button','spk','🔊');sb.style.marginRight='8px';sb.onclick=()=>speak(INFO.title+'. '+D.story);
  const go=h('button','btn go',S.i>0?'이어서 하기 ▶':'시작하기 ▶');go.id='start';go.onclick=()=>stage();
  c.append(sb,go);
  if(S.i>0){const r=h('button','btn ghost','처음부터');r.onclick=()=>{S=fresh();save();stage()};c.appendChild(r)}
  app.appendChild(c);
}
function stage(){
  const sp=D.stages[S.i];app.innerHTML='';CURQ='';
  app.appendChild(h('div','stagehead',`<div class="dots">${D.stages.map((s,k)=>`<span class="${k<S.i?'d':k===S.i?'c':''}">${s.icon}</span>`).join('')}</div><h2>${sp.icon} ${sp.title}</h2>`));
  const pr=h('div','prompt',`<span>${sp.prompt}</span>`);const sb=h('button','spk','🔊');sb.onclick=()=>speak(sp.title+'. '+sp.prompt+' '+strip(CURQ));pr.prepend(sb);app.appendChild(pr);
  if(LV==='easy'&&sp.tip)app.appendChild(h('div','tip','💡 '+sp.tip));
  const body=h('div','body');app.appendChild(body);
  RUN[sp.type](sp,body,clear,cxNew());
  window.scrollTo(0,0);
}
function clear(){
  const st=M===0?3:M<=2?2:1;S.stars[S.i]=st;S.i++;
  if(S.i>=D.stages.length){S.end=Date.now();save();markDone();return end()}
  save();fanfare();confetti();
  popup(`<div class="big">${'⭐'.repeat(st)}${'<span style="opacity:.25">⭐</span>'.repeat(3-st)}</div><h2>${['','좋아요!','잘했어요!','최고예요!'][st]}</h2><p>다음 놀이: ${D.stages[S.i].icon} ${D.stages[S.i].title}</p>`,'다음 ▶',stage);
}
function markDone(){try{const id=GAME+'@'+LV;if(localStorage.getItem('class-done-skip-'+id)===String(S.end))return;const d=JSON.parse(localStorage.getItem('class-done')||'{}')||{};if(!d[id]){d[id]={how:'auto',at:new Date().toISOString()};localStorage.setItem('class-done',JSON.stringify(d))}}catch(e){}}
function end(){
  const tot=S.stars.reduce((a,b)=>a+(b||0),0),max=D.stages.length*3;
  const file=location.pathname.split('/').pop()||'index.html';
  app.innerHTML=`<div class="card"><div class="big">🏆</div><h1>${D.endTitle}</h1><p class="story">${D.endText}</p><div style="font-family:Jua;font-size:30px;margin:10px 0">⭐ ${tot} / ${max}</div>
  ${LV!=='hard'?`<a class="btn go" id="nextlv" href="${file}?lv=${LV==='easy'?'normal':'hard'}">다음 단계 ${LV==='easy'?'🟡 보통':'🔴 어려움'} 도전 →</a><br>`:''}
  <a class="btn" href="index.html">🏠 게임 교실로</a><button class="btn ghost" id="again">처음부터 다시</button></div>`;
  $('#again').onclick=()=>{S=fresh();save();intro()};fanfare();confetti();
}
S.end?end():intro();
</script>
